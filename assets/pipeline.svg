<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Xerness pipeline: intent to runnable code">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63E6A2"/>
      <stop offset="1" stop-color="#3FD08A"/>
    </linearGradient>
    <style>
      .card { fill: #FFFFFF; stroke: #E6E6E6; stroke-width: 1.5; }
      .role { fill: #0A0A0A; font: 700 20px 'Helvetica Neue',Helvetica,Arial,sans-serif; }
      .sub  { fill: #8b8b8b; font: 400 14px 'Helvetica Neue',Helvetica,Arial,sans-serif; }
      .art  { fill: #0A0A0A; font: 600 13px 'Helvetica Neue',Helvetica,Arial,sans-serif; }
      .lbl  { fill: #63E6A2; font: 700 12px 'Helvetica Neue',Helvetica,Arial,sans-serif; letter-spacing: 1.5px; }
      .arrow { stroke: #63E6A2; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="300" fill="#FFFFFF"/>

  <!-- input -->
  <text x="40" y="60" class="lbl">INPUT</text>
  <rect x="40" y="80" width="180" height="130" rx="12" fill="#0A0A0A"/>
  <text x="60" y="120" fill="#FFFFFF" font="600 15px 'Helvetica Neue',Helvetica,Arial,sans-serif" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" font-size="15">&#8220;Add order</text>
  <text x="60" y="144" fill="#FFFFFF" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" font-size="15">history to the</text>
  <text x="60" y="168" fill="#FFFFFF" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" font-size="15">account page.&#8221;</text>
  <text x="60" y="196" class="sub">natural language</text>

  <!-- arrow -->
  <path class="arrow" d="M232 145 H288" marker-end="url(#a)"/>

  <!-- orchestrator label -->
  <text x="300" y="60" class="lbl">ORCHESTRATE &#183; DAG SCHEDULER</text>

  <!-- 4 role cards -->
  <g>
    <rect class="card" x="300" y="80" width="200" height="130" rx="12"/>
    <text x="320" y="118" class="role">PM Agent</text>
    <text x="320" y="146" class="sub">interprets intent</text>
    <rect x="320" y="164" width="90" height="26" rx="6" fill="#F1FBF5"/>
    <text x="332" y="182" class="art">PRD.md</text>
  </g>
  <path class="arrow" d="M508 145 H540" marker-end="url(#a)"/>
  <g>
    <rect class="card" x="548" y="80" width="200" height="130" rx="12"/>
    <text x="568" y="118" class="role">Tech Agent</text>
    <text x="568" y="146" class="sub">design + build</text>
    <rect x="568" y="164" width="120" height="26" rx="6" fill="#F1FBF5"/>
    <text x="580" y="182" class="art">src/ &#183; design</text>
  </g>
  <path class="arrow" d="M756 145 H788" marker-end="url(#a)"/>
  <g>
    <rect class="card" x="796" y="80" width="200" height="130" rx="12"/>
    <text x="816" y="118" class="role">Test Agent</text>
    <text x="816" y="146" class="sub">generates suite</text>
    <rect x="816" y="164" width="110" height="26" rx="6" fill="#F1FBF5"/>
    <text x="828" y="182" class="art">tests/ passing</text>
  </g>
  <path class="arrow" d="M1004 145 H1036" marker-end="url(#a)"/>
  <g>
    <rect class="card" x="1044" y="80" width="196" height="130" rx="12"/>
    <text x="1064" y="118" class="role">DevOps Agent</text>
    <text x="1064" y="146" class="sub">ship checklist</text>
    <rect x="1064" y="164" width="130" height="26" rx="6" fill="#F1FBF5"/>
    <text x="1076" y="182" class="art">release-plan.md</text>
  </g>

  <!-- memory bar -->
  <rect x="300" y="236" width="940" height="40" rx="10" fill="#0A0A0A"/>
  <circle cx="326" cy="256" r="5" fill="url(#g)"/>
  <text x="344" y="261" fill="#EDEDED" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" font-size="14">Repository-native memory</text>
  <text x="560" y="261" fill="#8b8b8b" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="400" font-size="14">decisions &#183; lessons &#183; patterns &#183; context &#8212; read by every agent, committed with your code</text>

  <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#63E6A2"/></marker>
</svg>
