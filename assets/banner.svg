<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Xerness — Multi-Agent orchestration infrastructure">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63E6A2"/>
      <stop offset="1" stop-color="#3FD08A"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="420" fill="url(#ink)"/>

  <!-- restrained dot grid, top-right -->
  <g fill="#1e1e1e">
    <g>
      <circle cx="980" cy="70" r="2"/><circle cx="1020" cy="70" r="2"/><circle cx="1060" cy="70" r="2"/><circle cx="1100" cy="70" r="2"/><circle cx="1140" cy="70" r="2"/><circle cx="1180" cy="70" r="2"/><circle cx="1220" cy="70" r="2"/>
      <circle cx="980" cy="110" r="2"/><circle cx="1020" cy="110" r="2"/><circle cx="1060" cy="110" r="2"/><circle cx="1100" cy="110" r="2"/><circle cx="1140" cy="110" r="2"/><circle cx="1180" cy="110" r="2"/><circle cx="1220" cy="110" r="2"/>
      <circle cx="980" cy="150" r="2"/><circle cx="1020" cy="150" r="2"/><circle cx="1060" cy="150" r="2"/><circle cx="1100" cy="150" r="2"/><circle cx="1140" cy="150" r="2"/><circle cx="1180" cy="150" r="2"/><circle cx="1220" cy="150" r="2"/>
    </g>
  </g>

  <!-- eyebrow -->
  <text x="80" y="120" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="6" fill="#8b8b8b">PART OF THE XAGENT FAMILY</text>

  <!-- wordmark -->
  <text x="76" y="238" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="130" font-weight="800" letter-spacing="4" fill="#FFFFFF">XERNESS</text>
  <!-- green accent block -->
  <rect x="80" y="262" width="132" height="10" rx="2" fill="url(#green)"/>

  <!-- tagline -->
  <text x="80" y="322" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#EDEDED">Multi-agent orchestration infrastructure</text>
  <text x="80" y="362" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#8b8b8b">Natural language in &#8594; orchestrated agents &#8594; runnable code out.</text>
</svg>
